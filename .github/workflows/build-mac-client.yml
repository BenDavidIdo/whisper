name: Build Mac App

on:
  push:
    branches:
      - claude/whisper-flow-clone-p8itt
    paths:
      - 'mac-client/**'
      - 'whisperflow/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  build:
    name: Build Whisper Flow.app
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: |
          pip install "setuptools<70"
          pip install --no-build-isolation openai-whisper==20231117
          pip install pyinstaller torch numpy \
            "fastapi==0.108.0" "uvicorn[standard]==0.30.1" \
            "websockets==12.0" "python-multipart==0.0.9"

      - name: Download Whisper tiny.en model
        run: |
          mkdir -p whisperflow/models
          python3 -c "import whisper; whisper.load_model('tiny.en', download_root='whisperflow/models')"

      - name: Build server binary (PyInstaller)
        run: |
          pyinstaller \
            --onedir \
            --name whisper-server \
            --collect-all whisper \
            --add-data "whisperflow:whisperflow" \
            --add-data "whisperflow/models:models" \
            --hidden-import=uvicorn.main \
            --hidden-import=uvicorn.config \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on \
            --distpath mac-client/server-dist \
            --workpath /tmp/pyinstaller-build \
            --specpath /tmp \
            whisperflow/server_main.py

      - name: Install dependencies
        working-directory: mac-client
        run: npm install

      - name: Build
        working-directory: mac-client
        env:
          # Skip code-signing — user will right-click → Open on first launch
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
        run: npm run dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFlow-mac
          path: |
            mac-client/dist/*.dmg
            mac-client/dist/*.zip
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/claude/whisper-flow-clone-p8itt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-client-latest
          name: Whisper Flow Mac Client
          body: |
            ## Whisper Flow Mac Client

            Hold **fn** (Globe key) to dictate. Release to paste the transcript.

            ### Install
            1. Download `Whisper Flow-*.dmg`
            2. Open the DMG → drag **Whisper Flow.app** to Applications
            3. Remove the macOS quarantine flag (**required** — right-click → Open alone is not enough for unsigned apps):
               ```
               xattr -cr /Applications/Whisper\ Flow.app
               ```
            4. Launch **Whisper Flow.app**
            5. Grant **Accessibility** permission when prompted (required for global fn key and paste)

            The Whisper server starts automatically inside the app — no separate server step needed.

            > **If macOS still blocks the app:** System Settings → Privacy & Security → scroll to the security warning → **Open Anyway**.
          files: |
            mac-client/dist/*.dmg
            mac-client/dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
